<body class="bg-background text-on-background font-body-md text-body-md h-screen w-full overflow-hidden flex selection:bg-primary selection:text-on-primary">
<!-- Suppressed SideNavBar & TopNavBar as this is a linear/transactional flow (New Report) -->
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col h-full w-full relative">
<!-- Header / Progress Area -->
<header class="flex justify-between items-center px-12 h-20 w-full border-b border-black/10 bg-surface-bright flex-shrink-0">
<div class="flex items-center gap-4">
<button aria-label="Cancel and return" class="p-2 border border-black/15 rounded hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<div class="h-6 w-px bg-black/15"></div>
<span class="font-headline-md text-headline-md">New Report</span>
</div>
<div class="flex items-center gap-8">
<!-- Progress Indicators -->
<div class="flex items-center gap-3">
<div class="flex items-center gap-2">
<div class="w-6 h-6 rounded-full bg-primary text-on-primary flex items-center justify-center font-label-sm text-label-sm">1</div>
<span class="font-label-sm text-label-sm text-primary uppercase tracking-widest">Location &amp; Category</span>
</div>
<div class="w-8 h-px bg-black/15"></div>
<div class="flex items-center gap-2 opacity-40">
<div class="w-6 h-6 rounded-full border border-primary text-primary flex items-center justify-center font-label-sm text-label-sm">2</div>
<span class="font-label-sm text-label-sm uppercase tracking-widest">Details</span>
</div>
<div class="w-8 h-px bg-black/15"></div>
<div class="flex items-center gap-2 opacity-40">
<div class="w-6 h-6 rounded-full border border-primary text-primary flex items-center justify-center font-label-sm text-label-sm">3</div>
<span class="font-label-sm text-label-sm uppercase tracking-widest">Review</span>
</div>
</div>
</div>
</header>
<!-- Split Layout Content -->
<div class="flex-1 flex w-full h-[calc(100vh-80px)]">
<!-- Left Side: Interactive Map -->
<section class="w-1/2 h-full border-r border-black/10 relative">
<div class="absolute top-6 left-6 right-6 z-10 flex flex-col gap-3">
<div class="bg-surface-bright border border-black/15 p-1 flex items-center shadow-sm">
<span class="material-symbols-outlined text-secondary ml-3" data-icon="search">search</span>
<input class="w-full bg-transparent border-none focus:ring-0 font-body-md text-body-md text-on-surface placeholder:text-secondary h-10 px-3" placeholder="Enter an address or drop a pin..." type="text"/>
<button class="bg-surface-container hover:bg-surface-variant text-on-surface px-4 py-2 border-l border-black/10 font-label-sm text-label-sm uppercase tracking-widest transition-colors h-10 flex items-center">
                            Locate Me
                        </button>
</div>
<div class="inline-flex bg-surface-bright/90 backdrop-blur-sm border border-black/15 px-4 py-2 self-start font-label-sm text-label-sm uppercase tracking-widest">
                        Step 1: Select Location
                    </div>
</div>

<span class="material-symbols-outlined text-[40px] text-primary" data-icon="location_on" data-weight="fill" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
</section>

<section class="w-1/2 h-full bg-surface-bright overflow-y-auto flex flex-col">
<div class="p-12 flex-1">
<div class="max-w-2xl mx-auto">
<h1 class="font-headline-lg text-headline-lg mb-4">Classify your report</h1>
<p class="font-body-lg text-body-lg text-secondary mb-12 max-w-lg">Select the primary category that best describes the issue at the selected location to route it to the appropriate department.</p>
<!-- Category Grid -->
<div class="grid grid-cols-2 gap-4">
<!-- Category Item - Selected State -->
<label class="cursor-pointer group relative flex flex-col p-6 border-2 border-primary bg-surface-container-low transition-all">
<input checked="" class="absolute opacity-0" name="category" type="radio" value="infrastructure"/>
<div class="flex justify-between items-start mb-8">
<span class="material-symbols-outlined text-[32px] text-primary" data-icon="construction">construction</span>
<div class="w-5 h-5 rounded-full border-2 border-primary flex items-center justify-center">
<div class="w-2.5 h-2.5 rounded-full bg-primary"></div>
</div>
</div>
<h3 class="font-label-sm text-label-sm uppercase tracking-widest mb-2">Infrastructure</h3>
<p class="font-body-md text-body-md text-secondary text-sm">Potholes, broken sidewalks, streetlights.</p>
</label>
<!-- Category Item - Default State -->
<label class="cursor-pointer group relative flex flex-col p-6 border border-black/15 bg-surface-bright hover:bg-surface-container-low transition-all">
<input class="absolute opacity-0" name="category" type="radio" value="sanitation"/>
<div class="flex justify-between items-start mb-8">
<span class="material-symbols-outlined text-[32px] text-secondary group-hover:text-primary transition-colors" data-icon="delete">delete</span>
<div class="w-5 h-5 rounded-full border border-black/25"></div>
</div>
<h3 class="font-label-sm text-label-sm uppercase tracking-widest mb-2">Sanitation</h3>
<p class="font-body-md text-body-md text-secondary text-sm">Missed collection, illegal dumping, graffiti.</p>
</label>
<!-- Category Item -->
<label class="cursor-pointer group relative flex flex-col p-6 border border-black/15 bg-surface-bright hover:bg-surface-container-low transition-all">
<input class="absolute opacity-0" name="category" type="radio" value="parks"/>
<div class="flex justify-between items-start mb-8">
<span class="material-symbols-outlined text-[32px] text-secondary group-hover:text-primary transition-colors" data-icon="park">park</span>
<div class="w-5 h-5 rounded-full border border-black/25"></div>
</div>
<h3 class="font-label-sm text-label-sm uppercase tracking-widest mb-2">Parks &amp; Rec</h3>
<p class="font-body-md text-body-md text-secondary text-sm">Fallen trees, broken playground equipment.</p>
</label>
<!-- Category Item -->
<label class="cursor-pointer group relative flex flex-col p-6 border border-black/15 bg-surface-bright hover:bg-surface-container-low transition-all">
<input class="absolute opacity-0" name="category" type="radio" value="traffic"/>
<div class="flex justify-between items-start mb-8">
<span class="material-symbols-outlined text-[32px] text-secondary group-hover:text-primary transition-colors" data-icon="traffic">traffic</span>
<div class="w-5 h-5 rounded-full border border-black/25"></div>
</div>
<h3 class="font-label-sm text-label-sm uppercase tracking-widest mb-2">Traffic &amp; Safety</h3>
<p class="font-body-md text-body-md text-secondary text-sm">Signal failure, blocked lanes, hazards.</p>
</label>
<!-- Category Item -->
<label class="cursor-pointer group relative flex flex-col p-6 border border-black/15 bg-surface-bright hover:bg-surface-container-low transition-all">
<input class="absolute opacity-0" name="category" type="radio" value="water"/>
<div class="flex justify-between items-start mb-8">
<span class="material-symbols-outlined text-[32px] text-secondary group-hover:text-primary transition-colors" data-icon="water_drop">water_drop</span>
<div class="w-5 h-5 rounded-full border border-black/25"></div>
</div>

<p class="font-body-md text-body-md text-secondary text-sm">Leaks, drainage issues, flooding.</p>
</label>

<span class="material-symbols-outlined text-[32px] text-secondary group-hover:text-primary transition-colors" data-icon="more_horiz">more_horiz</span>
<div class="w-5 h-5 rounded-full border border-black/25"></div>
</div>
<h3 class="font-label-sm text-label-sm uppercase tracking-widest mb-2">Other</h3>
<p class="font-body-md text-body-md text-secondary text-sm">General inquiries or undefined issues.</p>
</label>
</div>
</div>
