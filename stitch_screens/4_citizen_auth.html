        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;

        input, button, .border-strict { border-radius: 0 !important; }

<body class="bg-surface-container-highest min-h-screen antialiased text-on-surface flex items-center justify-center p-4 md:p-margin selection:bg-primary selection:text-on-primary">
<!-- 
        Navigation Shell Suppressed:
        As per the "Semantic Shell" mandate, transactional intents like Login/Signup 
        MUST exclude the TopAppBar, SideNavBar, and BottomNavBar to prioritize the canvas.
    -->
<div class="w-full max-w-container-max grid grid-cols-1 lg:grid-cols-12 gap-gutter relative">
<!-- Architectural Branding Panel (Left) -->
<div class="hidden lg:flex lg:col-span-7 flex-col justify-between border border-primary relative min-h-[700px] overflow-hidden group bg-surface-bright">
<img class="absolute inset-0 w-full h-full object-cover grayscale opacity-40 transition-transform duration-[20s] group-hover:scale-105" data-alt="Monochromatic brutalist concrete architecture featuring sharp geometric angles, deep shadows, and stark structural lines against a pale sky" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB6jEyFaXECpYywiqQ9saq-3YjQVlw9K_apSRhD6B83HcKW0sE3TfV72-l3tKMCs91XcQ_3YSC70-ON1jbHbC1whcXI5ewjuKRaJnBzSe0Xx5mlHwHRfymyoL5_HdB5BdHCo33RpL9N1NZzLUIaVbUTPE-GwEoTzwBOL7KoqOlCClHUJWMXdPL__8s3lGj2hO_saWMhDjYDfLvDfvQijgqmjwbOvJ5-Qwa6me0aAnpqDS_1YAzIuLnZVn7aodOxqLsyx_AeRASm3NfR"/>
<div class="absolute inset-0 bg-gradient-to-t from-surface-container-highest/80 to-transparent mix-blend-multiply"></div>
<div class="relative z-10 p-margin flex flex-col h-full justify-between pointer-events-none">
<h1 class="font-display-xl text-display-xl text-primary tracking-tighter uppercase leading-[0.85]">
                    CIVIC<br/>REZO
                </h1>
<div class="flex flex-col gap-unit">
<p class="font-headline-md text-headline-md text-primary bg-surface-bright border border-primary p-4 inline-block self-start shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
                        Secure Citizen Access
                    </p>
<p class="font-body-md text-body-md text-primary bg-surface-bright border border-primary p-4 inline-block self-start max-w-md shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
                        Institutional portal for secure identity verification and civic engagement. Restricted access.
                    </p>
</div>
</div>
</div>
<!-- Auth Functional Canvas (Right) -->
<div class="col-span-1 lg:col-span-5 flex flex-col justify-center w-full z-20">
<div class="bg-surface-bright border border-primary p-6 md:p-stack-md flex flex-col gap-stack-md shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] lg:shadow-none lg:-ml-gutter lg:mt-stack-lg">
<div class="lg:hidden mb-stack-sm">
<h2 class="font-headline-lg text-headline-lg text-primary tracking-tighter uppercase">CIVIC-REZO</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Secure Citizen Access</p>
</div>
<!-- Unified Tab Switcher -->
<div class="flex border-b border-outline-variant w-full">
<button class="flex-1 pb-4 border-b-2 border-primary text-primary font-label-sm text-label-sm uppercase tracking-widest text-left focus:outline-none focus-visible:bg-surface-container">
                        Login
                    </button>
<button class="flex-1 pb-4 border-b-2 border-transparent text-on-surface-variant font-label-sm text-label-sm uppercase tracking-widest text-left hover:text-primary transition-colors focus:outline-none focus-visible:bg-surface-container">
                        Register
                    </button>
</div>
<!-- Auth Form -->
<form class="flex flex-col gap-stack-sm">
<div class="flex flex-col gap-unit group">
<label class="font-label-sm text-label-sm text-primary uppercase tracking-widest flex justify-between" for="citizen_id">
<span>Citizen ID / Email</span>
</label>
<div class="relative">
<input class="w-full border border-outline-variant focus:border-primary px-4 py-3 bg-transparent font-body-lg text-body-lg text-primary focus:outline-none transition-colors placeholder:text-outline/50 border-strict" id="citizen_id" placeholder="Enter your credentials" type="text"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">
                                badge
                            </span>
</div>
</div>
<div class="flex flex-col gap-unit group">
<label class="font-label-sm text-label-sm text-primary uppercase tracking-widest" for="auth_key">
                            Access Key
                        </label>
<div class="relative">
<input class="w-full border border-outline-variant focus:border-primary px-4 py-3 bg-transparent font-body-lg text-body-lg text-primary focus:outline-none transition-colors placeholder:text-outline/50 border-strict" id="auth_key" placeholder="••••••••••••" type="password"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors cursor-pointer hover:text-secondary">
                                visibility_off
                            </span>
</div>
</div>
<div class="flex justify-between items-center mt-2">
<label class="flex items-center gap-3 cursor-pointer group">
<input class="w-5 h-5 border-outline-variant border-strict text-primary focus:ring-primary focus:ring-offset-0 bg-transparent cursor-pointer" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-primary transition-colors">Maintain Session</span>
</label>
<a class="font-label-sm text-label-sm text-primary underline decoration-1 underline-offset-4 uppercase tracking-widest hover:bg-primary hover:text-on-primary px-2 py-1 transition-colors border-strict" href="#">
                            Recover Key
                        </a>
</div>
<button class="mt-stack-sm bg-primary text-on-primary py-5 px-6 flex justify-between items-center group hover:bg-tertiary-container transition-colors border-strict focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-primary" type="button">
<span class="font-label-sm text-label-sm uppercase tracking-widest">Authenticate Session</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">
                            arrow_forward
                        </span>
</button>
</form>
<div class="mt-stack-sm pt-stack-sm border-t border-outline-variant/30 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-outline text-sm">lock</span>
<p class="font-body-md text-body-md text-outline text-sm">Protected by Civic Protocol 256-bit encryption</p>
</div>
</div>
</div>
</div>
